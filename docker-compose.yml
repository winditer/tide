version: "3.9"

services:
  cc-switch:
    build:
      context: .
      dockerfile: Dockerfile.cc-switch
    image: tide-cc-switch:latest
    container_name: tide-cc-switch
    restart: unless-stopped
    volumes:
      - cc-switch-data:/root/.cc-switch
    ports:
      - "15721:15721"
      - "15722:15722"
      - "15723:15723"
    networks:
      - tide-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tide-backend:latest
    container_name: tide-backend
    restart: unless-stopped
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/tide.db
      # Codex CLI 通过 config.toml 中 model_providers 直连 CC Switch API 路由
      # 不使用 HTTP_PROXY/HTTPS_PROXY（CC Switch 不支持 CONNECT 隧道）
      NO_PROXY: "localhost,127.0.0.1,backend,frontend,cc-switch,open.larksuite.com,open.feishu.cn,*.larksuite.com,*.feishu.cn"
      OPENAI_API_KEY: "proxy-placeholder"
      # Claude CLI 通过 CC Switch 代理访问 Anthropic API
      ANTHROPIC_API_KEY: "PROXY_MANAGED"
      ANTHROPIC_BASE_URL: "http://tide-cc-switch:15721"
      # 容器内强制使用绝对路径，覆盖 .env 中可能的 "~/..." 字面值（Docker 不展开 ~）
      CODEX_HOME: /app/.agent/codex
      CLAUDE_HOME: /app/.agent/claude
      QODER_HOME: /app/.agent/qoder
      CODEX_SESSIONS_DIR: /app/.agent/codex/sessions
      CLAUDE_PROJECTS_DIR: /app/.agent/claude/projects
      QODER_PROJECTS_DIR: /app/.agent/qoder/projects
      # Qoder CLI PAT 认证（从 .env 中读取）
      QODER_PERSONAL_ACCESS_TOKEN: ${QODER_PERSONAL_ACCESS_TOKEN:-}
    volumes:
      - tide-data:/app/data
      - tide-runtime:/app/.tide
      - tide-agent-home:/app/.agent
      - tide-qoder-home:/root/.qoder
      - tide-claude-home:/root/.claude
    ports:
      - "8000:8000"
    depends_on:
      - cc-switch
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tide-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_BASE_PATH: /tide
    image: tide-frontend:latest
    container_name: tide-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BASE_PATH: /tide
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - tide-network
      - brainstorming_default

networks:
  tide-network:
    driver: bridge
  brainstorming_default:
    external: true

volumes:
  tide-data:
  tide-runtime:
  tide-agent-home:
  tide-qoder-home:
  tide-claude-home:
  cc-switch-data:
